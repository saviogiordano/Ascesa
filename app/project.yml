name: Ascesa

options:
  bundleIdPrefix: com.salvatoregiordano
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"
  CoreGPX:
    url: https://github.com/vincentneo/CoreGPX
    from: "0.9.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  # ─── iOS App ─────────────────────────────────────────────────────────────────
  Ascesa:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Sources/Presentation
      - path: Sources/Domain
      - path: Sources/Data

    resources:
      - path: Resources/iOS/Assets.xcassets

    info:
      path: Resources/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Ascesa necessita del Bluetooth per connettersi al rullo TACX FLUX e alle fasce cardio BLE."
        NSHealthShareUsageDescription: "Ascesa legge la frequenza cardiaca dall'Apple Watch durante gli allenamenti."
        NSHealthUpdateUsageDescription: "Ascesa salva le sessioni di allenamento nell'app Salute."
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

    entitlements:
      path: Resources/iOS/Ascesa.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

    settings:
      base:
        # TODO: set DEVELOPMENT_TEAM to your Apple Developer Team ID
        PRODUCT_BUNDLE_IDENTIFIER: com.salvatoregiordano.ascesa
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

    dependencies:
      - package: GRDB
      - package: CoreGPX
      # AscesaWatch viene costruito e testato con lo scheme separato.
      # L'embedding nell'iOS app va configurato su device fisico (Phase MVP),
      # non sul simulatore dove causa InvalidWatchKitApp (MIInstallerErrorDomain 92).

  # ─── watchOS Companion App ────────────────────────────────────────────────────
  AscesaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"

    sources:
      - path: Sources/Watch

    resources:
      - path: Resources/Watch/Assets.xcassets

    info:
      path: Resources/Watch/Info.plist
      properties:
        CFBundleDisplayName: Ascesa
        NSHealthShareUsageDescription: "Ascesa legge la frequenza cardiaca durante gli allenamenti."
        NSHealthUpdateUsageDescription: "Ascesa salva la sessione di allenamento in Salute."
        WKBackgroundModes:
          - workout-processing
        WKWatchKitApp: true

    entitlements:
      path: Resources/Watch/AscesaWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

    settings:
      base:
        # TODO: set DEVELOPMENT_TEAM to your Apple Developer Team ID
        PRODUCT_BUNDLE_IDENTIFIER: com.salvatoregiordano.ascesa.watchkitapp
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
