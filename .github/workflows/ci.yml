name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancella run precedenti sullo stesso branch/PR non appena parte un nuovo commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build (iOS + watchOS)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleziona Xcode latest-stable
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installa xcodegen
        run: brew install xcodegen

      - name: Cache pacchetti SPM
        uses: actions/cache@v4
        id: spm-cache
        with:
          path: ~/.spm-packages
          key: spm-${{ hashFiles('app/project.yml') }}
          restore-keys: spm-

      - name: Genera progetto Xcode
        working-directory: app
        run: xcodegen generate --spec project.yml

      - name: Risolvi dipendenze SPM
        working-directory: app
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Ascesa.xcodeproj \
            -scheme Ascesa \
            -clonedSourcePackagesDirPath ~/.spm-packages

      - name: Build — iOS (Ascesa)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ascesa.xcodeproj \
            -scheme Ascesa \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath ~/.spm-packages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build — watchOS (AscesaWatch)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ascesa.xcodeproj \
            -scheme AscesaWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  # ─── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Test (Domain + Data)
    runs-on: macos-15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleziona Xcode latest-stable
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installa xcodegen
        run: brew install xcodegen

      - name: Ripristina cache SPM
        uses: actions/cache@v4
        with:
          path: ~/.spm-packages
          key: spm-${{ hashFiles('app/project.yml') }}
          restore-keys: spm-

      - name: Genera progetto Xcode
        working-directory: app
        run: xcodegen generate --spec project.yml

      # ── Unit test Domain + Data ───────────────────────────────────────────────
      # Il target AscesaTests va aggiunto in project.yml nella Phase MVP.
      # Decommentare quando il target è pronto.
      #
      # - name: Unit test — Domain + Data
      #   working-directory: app
      #   run: |
      #     set -o pipefail
      #     xcodebuild test \
      #       -project Ascesa.xcodeproj \
      #       -scheme AscesaTests \
      #       -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
      #       -clonedSourcePackagesDirPath ~/.spm-packages \
      #       CODE_SIGN_IDENTITY="" \
      #       CODE_SIGNING_REQUIRED=NO \
      #       CODE_SIGNING_ALLOWED=NO
      # ─────────────────────────────────────────────────────────────────────────

      - name: Placeholder (test target non ancora configurato)
        run: |
          echo "::notice file=doc/Piano_di_Sviluppo.md::Test target AscesaTests da aggiungere in Phase MVP — vedi sezione MVP-TEST"
